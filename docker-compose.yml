services:
  postgres:
    profiles: [compose-postgres]
    image: postgres:16
    container_name: runtime-tracker-postgres
    environment:
      POSTGRES_DB: ${COMPOSE_PGDATABASE:-runtime_tracker}
      POSTGRES_USER: ${COMPOSE_PGUSER:-tracker}
      POSTGRES_PASSWORD: ${COMPOSE_PGPASSWORD:-}
    ports:
      - "${COMPOSE_PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: runtime-tracker-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD to the existing Neo4j password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
